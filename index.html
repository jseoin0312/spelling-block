<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나만의 독서 책장</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#493c39;background:#fff9f1}*{box-sizing:border-box}body{margin:0}header{background:#ffe6c7;padding:25px 5%;border-bottom:4px solid #f5cba5}h1{margin:0;font-size:clamp(24px,4vw,36px)}.sub{color:#80665b}main{max-width:1100px;margin:auto;padding:22px 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,.btn{border:0;background:#eaa47e;color:#382a27;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}button:hover{filter:brightness(.96)}button.secondary{background:#f8e6d2}.tab.active{background:#a5c9ad}.panel{background:white;border:2px solid #f3e0cc;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 14px #6b4c3110}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.stat{background:#fdf1df;padding:16px;border-radius:16px}.stat strong{display:block;font-size:26px}.shelf{display:flex;align-items:end;gap:10px;flex-wrap:wrap;min-height:170px;border-bottom:14px solid #b88161;padding:15px 8px}.book{height:125px;width:70px;border-radius:6px 12px 5px 5px;color:#fff;padding:10px 6px;writing-mode:vertical-rl;overflow:hidden;text-overflow:ellipsis;box-shadow:4px 3px 0 #0002;cursor:pointer;font-weight:bold}.book:nth-child(5n+1){background:#bd7c78}.book:nth-child(5n+2){background:#8ba99c}.book:nth-child(5n+3){background:#b19bcb}.book:nth-child(5n+4){background:#d7aa60}.book:nth-child(5n){background:#7f9eb7}label{display:block;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d9c8b9;border-radius:10px;font:inherit;background:#fff}textarea{min-height:85px}input[type=checkbox]{width:auto}dialog{border:0;border-radius:20px;max-width:650px;width:calc(100% - 25px);max-height:90vh;overflow:auto;padding:24px}dialog::backdrop{background:#30241d88}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.badge{padding:16px;border-radius:15px;background:#fff2d9;text-align:center}.badge.locked{filter:grayscale(1);opacity:.5}.badge .emoji{font-size:38px}.bar{height:15px;background:#f4e8dc;border-radius:20px;overflow:hidden}.bar>span{display:block;background:#9bc6a5;height:100%}.record{border-bottom:1px solid #eee;padding:12px 0}.record:last-child{border:0}.small{font-size:13px;color:#7c6a62}.recommend{border:2px dashed #dfbda6;border-radius:16px;padding:18px;background:#fff9ed}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.chartline{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;margin:10px 0}.empty{padding:30px;text-align:center;color:#8c776c}footer{text-align:center;padding:30px;color:#8c776c}@media(max-width:600px){.panel{padding:15px}.tabs button{flex:1 1 42%}.book{width:55px}}
</style></head><body><header><h1>📚 나만의 독서 책장</h1><div class="sub">읽고, 기록하고, 나만의 책장을 채워요!</div></header><main><div class="panel row"><div><label for="student" style="margin:0 0 5px">현재 학생</label><select id="student" style="min-width:170px"></select></div><div class="actions"><button id="addStudent" class="secondary">+ 학생 추가</button><button id="newBook">+ 새 책 기록하기</button></div></div><nav class="tabs" id="tabs"><button class="tab active" data-page="home">📚 내 책장</button><button class="tab" data-page="badges">🏅 독서 배지</button><button class="tab" data-page="challenge">🎯 독서 챌린지</button><button class="tab" data-page="analysis">📊 독서 취향</button><button class="tab" data-page="recommend">💌 책 추천</button><button class="tab" data-page="teacher">👩‍🏫 선생님</button></nav><section id="content"></section></main><footer>이 브라우저에 기록이 저장됩니다 · 공용 기기에서는 개인정보 입력에 주의하세요.</footer>
<dialog id="bookDialog"><h2 id="formTitle">📖 독서기록 작성</h2><form id="bookForm"><input type="hidden" id="bookId"><label>책 제목 *</label><input id="title" required maxlength="100"><label>지은이</label><input id="author" maxlength="80"><label>읽은 날짜 *</label><input type="date" id="date" required><label>책 종류</label><select id="genre"><option>동화</option><option>과학</option><option>역사</option><option>만화</option><option>시</option><option>기타</option></select><label>책 표지 이미지 (선택)</label><input type="file" id="cover" accept="image/*"><div class="small">작은 이미지 권장 (최대 500KB). 선택하지 않으면 기본 책등이 표시됩니다.</div><label>별점</label><select id="rating"><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select><label>책을 읽고 느낀 감정</label><select id="emotion"><option>😊 재미있어요</option><option>😢 슬퍼요</option><option>😮 놀라워요</option><option>🤔 생각할 거리가 많아요</option><option>❤️ 감동적이에요</option></select><label>한 줄 독서평 *</label><input id="oneLine" maxlength="120" required placeholder="이 책을 한 문장으로 표현한다면?"><label>인상 깊었던 문장</label><textarea id="quote"></textarea><label>책을 읽고 든 생각</label><textarea id="thought"></textarea><label>친구에게 추천하는 이유</label><textarea id="reason"></textarea><div class="actions"><button type="submit">저장하기</button><button type="button" class="secondary" id="cancelBook">취소</button></div></form></dialog>
<dialog id="viewDialog"><div id="viewBody"></div><div class="actions"><button id="editBook">수정</button><button id="deleteBook" class="secondary">삭제</button><button id="closeView" class="secondary">닫기</button></div></dialog>
<script>
const KEY='reading_shelf_v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.students))state={students:[{id:'s1',name:'나의 책장'}],books:[],goals:{},current:'s1'};state.books ||= [];state.goals ||= {};if(!state.students.length)state.students=[{id:'s1',name:'나의 책장'}];if(!state.students.some(s=>s.id===state.current))state.current=state.students[0].id;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const month=()=>new Date().toLocaleDateString('sv-SE').slice(0,7);let page='home',selectedBook=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('저장 공간이 부족해 저장하지 못했어요. 표지 이미지를 줄이거나 데이터를 백업해 주세요.');return false}}function mine(){return state.books.filter(b=>b.student===state.current)}function countMonth(b){return b.date?.slice(0,7)===month()}function updateStudents(){ $('student').innerHTML=state.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');$('student').value=state.current}
function render(){updateStudents();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===page));let b=mine(),m=b.filter(countMonth),out='';if(page==='home'){out=`<div class="grid"><div class="stat">읽은 책 <strong>${b.length}권</strong></div><div class="stat">이번 달 <strong>${m.length}권</strong></div><div class="stat">평균 별점 <strong>${b.length?(b.reduce((a,x)=>a+Number(x.rating),0)/b.length).toFixed(1):'-'} ⭐</strong></div></div><div class="panel"><div class="row"><h2>📚 나의 책장</h2><select id="sort" style="width:auto"><option value="recent">최신순</option><option value="title">제목순</option><option value="rating">별점순</option></select></div><div class="shelf" id="shelf"></div></div><div class="panel"><h2>✏️ 최근 한 줄 독서평</h2>${b.slice().sort((a,z)=>z.date.localeCompare(a.date)).slice(0,5).map(x=>`<div class="record"><b>${esc(x.title)}</b> — ${esc(x.oneLine)}</div>`).join('')||'<div class="empty">첫 번째 책을 기록해 보세요!</div>'}</div>`}
if(page==='badges'){out=`<div class="panel"><h2>🏅 나의 독서 배지</h2><p>읽은 책 ${b.length}권 · 목표를 달성하면 배지가 열려요.</p><div class="grid">${[[5,'🥉','책 탐험가'],[10,'🥈','독서 달인'],[20,'🥇','책의 왕']].map(([n,e,t])=>`<div class="badge ${b.length<n?'locked':''}"><div class="emoji">${e}</div><b>${t}</b><p>${n}권 달성</p><div>${b.length>=n?'🎉 획득 완료':`${Math.min(b.length,n)}/${n}권`}</div></div>`).join('')}</div></div>`}
if(page==='challenge'){let goal=Number(state.goals[state.current+'_'+month()]??3),pct=Math.min(100,Math.round(m.length/goal*100));out=`<div class="panel"><h2>🎯 ${month()} 독서 챌린지</h2><label>이번 달 목표 권수</label><div class="row"><input type="number" min="1" max="100" id="goal" value="${goal}" style="max-width:160px"><button id="saveGoal">목표 저장</button></div><h3>${m.length} / ${goal}권 (${pct}%)</h3><div class="bar"><span style="width:${pct}%"></span></div><p>${m.length>=goal?'🎉 이번 달 목표를 달성했어요!':'목표까지 '+(goal-m.length)+'권 남았어요!'}</p></div>`}
if(page==='analysis'){let genres={},emotions={};b.forEach(x=>{genres[x.genre]=(genres[x.genre]||0)+1;emotions[x.emotion]=(emotions[x.emotion]||0)+1});const bars=o=>Object.entries(o).sort((a,z)=>z[1]-a[1]).map(([k,n])=>`<div class="chartline"><span>${esc(k)}</span><div class="bar"><span style="width:${Math.round(n/b.length*100)}%"></span></div><b>${n}</b></div>`).join('')||'<p>책을 기록하면 분석 결과가 나타나요.</p>';out=`<div class="panel"><h2>📊 내가 좋아하는 책 종류</h2>${bars(genres)}</div><div class="panel"><h2>💗 독서 감정 분석</h2>${bars(emotions)}</div>`}
if(page==='recommend'){out=`<div class="panel"><h2>💌 친구에게 책 추천하기</h2><p>책을 선택하면 추천 카드를 만들 수 있어요.</p><label>추천할 책</label><select id="recSelect"><option value="">책을 선택하세요</option>${b.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select><div id="recCard"></div></div>`}
if(page==='teacher'){out=`<div class="panel"><h2>👩‍🏫 선생님 확인 화면</h2><p class="small">이 화면은 현재 브라우저에 저장된 학생 데이터만 확인하는 시연용입니다. 비밀번호나 중앙 서버가 없어 실제 학급 관리용으로는 적합하지 않습니다.</p><div class="grid">${state.students.map(s=>{let a=state.books.filter(x=>x.student===s.id);return `<div class="stat"><b>${esc(s.name)}</b><strong>${a.length}권</strong><button class="secondary" data-student="${esc(s.id)}">기록 보기</button></div>`}).join('')}</div><div id="teacherDetail"></div><div class="actions"><button id="exportData">전체 데이터 JSON 백업</button><label style="margin:0"><span class="btn">JSON 백업 불러오기</span><input id="importData" type="file" accept=".json,application/json" style="display:none"></label></div></div>`}
$('content').innerHTML=out;if(page==='home'){let sort='recent';const draw=()=>{let a=b.slice();if(sort==='recent')a.sort((x,y)=>y.date.localeCompare(x.date));if(sort==='title')a.sort((x,y)=>x.title.localeCompare(y.title,'ko'));if(sort==='rating')a.sort((x,y)=>y.rating-x.rating);$('shelf').innerHTML=a.map(x=>`<button class="book" data-book="${esc(x.id)}" title="${esc(x.title)}">${esc(x.title)}</button>`).join('')||'<div class="empty">책장에 아직 책이 없어요. 첫 책을 추가해 보세요!</div>'};draw();$('sort').onchange=e=>{sort=e.target.value;draw()};$('shelf').onclick=e=>{let t=e.target.closest('[data-book]');if(t)viewBook(t.dataset.book)}}if(page==='challenge')$('saveGoal').onclick=()=>{let n=Number($('goal').value);if(!Number.isInteger(n)||n<1||n>100)return alert('목표는 1~100권 사이로 설정해 주세요.');state.goals[state.current+'_'+month()]=n;if(save())render()};if(page==='recommend')$('recSelect').onchange=e=>{let x=b.find(t=>t.id===e.target.value);$('recCard').innerHTML=x?`<div class="recommend" id="printCard"><h2>📚 이 책을 추천해요!</h2><h3>${esc(x.title)}</h3><p>✍️ ${esc(x.author)}</p><p>⭐ ${'★'.repeat(Number(x.rating))}</p><p>💬 ${esc(x.oneLine)}</p><p>💌 ${esc(x.reason||'친구에게 소개하고 싶은 책이에요!')}</p><p class="small">추천한 친구: ${esc(state.students.find(s=>s.id===state.current)?.name)}</p></div><div class="actions"><button id="copyRec">추천 문구 복사</button><button id="printRec" class="secondary">추천 카드 인쇄 / PDF 저장</button></div>`:'';if(x){$('copyRec').onclick=()=>navigator.clipboard?.writeText(`📚 ${x.title}\n${x.oneLine}\n${x.reason||''}`).then(()=>alert('복사했어요!')).catch(()=>alert('복사할 수 없어요.'));$('printRec').onclick=()=>{let w=window.open('','_blank');if(!w)return alert('팝업을 허용해 주세요.');w.document.write('<!doctype html><meta charset="utf-8"><title>책 추천 카드</title><style>body{font-family:sans-serif;padding:35px}.recommend{border:3px dashed #dbab8e;border-radius:18px;padding:30px}</style>'+ $('printCard').outerHTML);w.document.close();w.focus();w.print()}}};if(page==='teacher'){document.querySelectorAll('[data-student]').forEach(btn=>btn.onclick=()=>{let s=state.students.find(x=>x.id===btn.dataset.student),a=state.books.filter(x=>x.student===s.id);$('teacherDetail').innerHTML=`<h3>${esc(s.name)}의 독서기록</h3>${a.map(x=>`<div class="record"><b>${esc(x.title)}</b> (${esc(x.date)})<p>${esc(x.oneLine)}</p></div>`).join('')||'아직 기록이 없어요.'}`});$('exportData').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='독서기록장_백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importData').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.students)||!Array.isArray(obj.books)||!obj.students.every(x=>typeof x.id==='string'&&typeof x.name==='string')||!obj.books.every(x=>typeof x.student==='string'&&typeof x.title==='string'&&typeof x.date==='string'))throw Error();if(!confirm('현재 기록을 백업 파일 내용으로 교체할까요?'))return;state={students:obj.students,books:obj.books,goals:obj.goals||{},current:obj.students[0]?.id};if(!state.students.length)throw Error();if(save())render()}catch{alert('올바른 독서기록장 백업 파일이 아닙니다.')}}}}
$('student').onchange=e=>{state.current=e.target.value;save();render()};$('addStudent').onclick=()=>{let name=prompt('학생 이름 또는 별명을 입력하세요.');if(!name?.trim())return;name=name.trim().slice(0,40);let s={id:uid(),name};state.students.push(s);state.current=s.id;if(save())render()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{page=t.dataset.page;render()});function resetForm(){ $('bookForm').reset();$('bookId').value='';$('date').value=new Date().toLocaleDateString('sv-SE');$('formTitle').textContent='📖 새 독서기록 작성'}$('newBook').onclick=()=>{resetForm();$('bookDialog').showModal()};$('cancelBook').onclick=()=>$('bookDialog').close();$('closeView').onclick=()=>$('viewDialog').close();function viewBook(id){let x=state.books.find(t=>t.id===id);if(!x)return;selectedBook=id;$('viewBody').innerHTML=`<h2>📖 ${esc(x.title)}</h2>${x.cover?`<img src="${esc(x.cover)}" alt="책 표지" style="max-height:180px;max-width:100%;object-fit:contain">`:''}<p>지은이: ${esc(x.author)} · ${esc(x.date)}</p><p>${esc(x.genre)} · ${'⭐'.repeat(Number(x.rating))} · ${esc(x.emotion)}</p><h3>한 줄 독서평</h3><p>${esc(x.oneLine)}</p><h3>인상 깊은 문장</h3><p>${esc(x.quote)}</p><h3>나의 생각</h3><p>${esc(x.thought)}</p><h3>추천하는 이유</h3><p>${esc(x.reason)}</p>`;$('viewDialog').showModal()}$('editBook').onclick=()=>{let x=state.books.find(t=>t.id===selectedBook);if(!x)return;for(let k of ['title','author','date','genre','rating','emotion','oneLine','quote','thought','reason'])$(k).value=x[k]??'';$('bookId').value=x.id;$('formTitle').textContent='📖 독서기록 수정';$('viewDialog').close();$('bookDialog').showModal()};$('deleteBook').onclick=()=>{if(!confirm('이 독서기록을 삭제할까요?'))return;state.books=state.books.filter(x=>x.id!==selectedBook);if(save()){$('viewDialog').close();render()}};
$('bookForm').onsubmit=async e=>{e.preventDefault();let id=$('bookId').value,old=state.books.find(x=>x.id===id),x={id:id||uid(),student:state.current};for(let k of ['title','author','date','genre','rating','emotion','oneLine','quote','thought','reason'])x[k]=$(k).value.trim();x.cover=old?.cover||'';let file=$('cover').files[0];if(file){if(file.size>500000)return alert('표지 이미지는 500KB 이하로 선택해 주세요.');x.cover=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}if(!x.title||!x.oneLine)return alert('책 제목과 한 줄 독서평을 입력해 주세요.');if(id)state.books=state.books.map(b=>b.id===id?x:b);else state.books.push(x);if(save()){$('bookDialog').close();render();if(!id)alert('🎉 독서기록이 완성되었어요!')}};render();
</script></body></html>
