<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스펠링 블록 맞추기</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#24304c;background:#f3f7ff}*{box-sizing:border-box}body{margin:0;padding:24px 12px}.app{max-width:850px;margin:auto;background:white;border-radius:28px;padding:28px;box-shadow:0 12px 35px #7a9bd52b}h1{text-align:center;margin:0 0 8px;font-size:clamp(24px,5vw,36px)}.sub{text-align:center;color:#75829c;margin-bottom:20px}.toolbar,.stats,.controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.toolbar{margin-bottom:18px}button,select{font:inherit;border:0;border-radius:13px;padding:11px 15px;cursor:pointer}select{background:#edf2ff;color:#293d70}.stats{justify-content:space-between;font-weight:700;margin-bottom:12px}.bar{height:11px;border-radius:20px;background:#e9edfa;overflow:hidden}.fill{height:100%;background:#6e9df9;width:0;transition:width .25s}.question{text-align:center;padding:28px 0 12px}.label{color:#8490a8;font-size:14px}.meaning{font-size:clamp(29px,6vw,43px);font-weight:800;margin:10px 0}.slots,.letters{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;min-height:76px;align-items:center}.slot,.tile{width:clamp(35px,8vw,54px);height:clamp(47px,10vw,65px);border-radius:13px;display:grid;place-items:center;font-size:clamp(20px,4vw,30px);font-weight:800;user-select:none}.slot{border:2px dashed #aebee2;background:#f5f8ff;color:#40578c}.slot.filled{border:2px solid #8eabeb;background:#eaf1ff;cursor:pointer}.slot.over{background:#dce9ff}.letters{padding:20px 4px;margin:15px 0;background:#f8faff;border-radius:20px}.tile{background:#ffd879;color:#65440e;box-shadow:0 4px 0 #e6b44d;cursor:grab;touch-action:manipulation}.tile.used{visibility:hidden}.controls{margin:20px 0}button.primary{background:#5e83ed;color:white;font-weight:800}button.secondary{background:#e9efff;color:#3557a5;font-weight:700}.feedback{text-align:center;min-height:31px;font-weight:800;font-size:18px}.good{color:#168d62}.bad{color:#db5267}.footer{text-align:center;color:#8b94aa;font-size:13px}.speed{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}.complete{text-align:center;padding:30px 10px}.complete h2{font-size:30px}.hidden{display:none}@media(max-width:480px){.app{padding:18px 12px;border-radius:20px}.slot,.tile{width:35px;height:47px}.slots,.letters{gap:5px}.stats{font-size:13px}}
</style></head><body><main class="app"><h1>🧩 스펠링 블록 맞추기</h1><div class="sub">뜻을 보고 알파벳을 조합해 보세요!</div><div class="toolbar"><select id="category" aria-label="카테고리"><option value="all">🌈 전체 단어</option><option value="school">🏫 학교생활</option><option value="feel">😊 감정</option><option value="subject">📚 교과목</option><option value="action">🏃 동작</option><option value="weather">☀️ 날씨</option></select><button class="secondary" id="restart">🔄 다시 시작</button></div><div id="game"><div class="stats"><span id="progress">1 / 27</span><span id="score">⭐ 정답 0개</span></div><div class="bar"><div class="fill" id="fill"></div></div><section class="question"><div class="label">이 뜻에 맞는 영어 단어는?</div><div class="meaning" id="meaning"></div><div class="speed"><button class="secondary" id="speak">🔊 발음 듣기</button><select id="speed" aria-label="발음 속도"><option value="0.65">🐢 느리게</option><option value="0.85" selected>▶️ 보통</option><option value="1.05">🐇 빠르게</option></select></div></section><div class="label" style="text-align:center;margin:12px">빈칸에 알파벳을 넣어 보세요</div><div class="slots" id="slots"></div><div class="letters" id="letters"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="secondary" id="clear">↩️ 다시 맞추기</button><button class="primary" id="check">✅ 정답 확인</button><button class="secondary" id="next">다음 문제 ➜</button></div></div><div id="complete" class="complete hidden"><h2>🎉 학습 완료!</h2><p id="result"></p><button class="primary" id="again">다시 도전하기</button></div><div class="footer">블록을 드래그하거나 눌러서 빈칸에 넣을 수 있어요.</div></main><script>
const words=[['Class','수업, 반','school'],['Homework','숙제','school'],['Teacher','선생님','school'],['Friend','친구','school'],['Desk','책상','school'],['Chair','의자','school'],['Pencil','연필','school'],['Eraser','지우개','school'],['Happy','행복한','feel'],['Sad','슬픈','feel'],['Angry','화난','feel'],['Tired','피곤한','feel'],['English','영어','subject'],['Math','수학','subject'],['Music','음악','subject'],['P.E.','체육','subject'],['Drink','마시다','action'],['Study','공부하다','action'],['Play','놀다, (악기를) 연주하다','action'],['Read','읽다','action'],['Write','쓰다','action'],['Sleep','잠자다','action'],['Weather','날씨','weather'],['Sunny','화창한','weather'],['Rainy','비가 오는','weather'],['Cloudy','흐린','weather'],['Warm','따뜻한','weather']];
const $=id=>document.getElementById(id);let order=[],index=0,correct=0,tiles=[],placed=[],solved=false,autoSpeakTimer=null;const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function speak(){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(order[index][0]==='P.E.'?'physical education':order[index][0]);u.lang='en-US';u.rate=Number($('speed').value);speechSynthesis.speak(u)}function start(){clearTimeout(autoSpeakTimer);if('speechSynthesis'in window)speechSynthesis.cancel();order=shuffle(words.filter(w=>$('category').value==='all'||w[2]===$('category').value));index=0;correct=0;$('complete').classList.add('hidden');$('game').classList.remove('hidden');render()}function render(){clearTimeout(autoSpeakTimer);if('speechSynthesis'in window)speechSynthesis.cancel();solved=false;let w=order[index];tiles=shuffle([...w[0].toUpperCase()].map((c,i)=>({id:i,c})));placed=Array(w[0].length).fill(null);$('meaning').textContent=w[1];$('feedback').textContent='';$('feedback').className='feedback';$('progress').textContent=`${index+1} / ${order.length}`;$('score').textContent=`⭐ 정답 ${correct}개`;$('fill').style.width=(index/order.length*100)+'%';$('next').disabled=false;draw();autoSpeakTimer=setTimeout(speak,250)}function put(id,slot){if(solved)return;let existing=placed.indexOf(id);if(existing>=0)placed[existing]=null;if(slot===undefined)slot=placed.indexOf(null);if(slot<0)return;if(placed[slot]!==null)return;placed[slot]=id;draw()}function draw(){let s=$('slots'),l=$('letters');s.innerHTML='';l.innerHTML='';placed.forEach((id,i)=>{let d=document.createElement('div');d.className='slot'+(id!==null?' filled':'');d.textContent=id===null?'':tiles.find(t=>t.id===id).c;d.dataset.slot=i;d.addEventListener('click',()=>{if(id!==null&&!solved){placed[i]=null;draw()}});d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});d.addEventListener('dragleave',()=>d.classList.remove('over'));d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');put(Number(e.dataTransfer.getData('text/plain')),i)});s.appendChild(d)});tiles.forEach(t=>{let d=document.createElement('div');d.className='tile'+(placed.includes(t.id)?' used':'');d.textContent=t.c;d.draggable=!solved;d.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(t.id)));d.addEventListener('click',()=>put(t.id));l.appendChild(d)})}function check(){if(solved)return;if(placed.includes(null)){$('feedback').textContent='모든 빈칸을 채워 주세요!';$('feedback').className='feedback bad';return}let answer=placed.map(id=>tiles.find(t=>t.id===id).c).join('');if(answer===order[index][0].toUpperCase()){correct++;solved=true;$('score').textContent=`⭐ 정답 ${correct}개`;$('feedback').textContent='🎉 정답이에요! 정말 잘했어요!';$('feedback').className='feedback good';speak()}else{$('feedback').textContent='💪 아쉬워요! 다시 생각해 보세요.';$('feedback').className='feedback bad'}}function next(){clearTimeout(autoSpeakTimer);if('speechSynthesis'in window)speechSynthesis.cancel();if(index<order.length-1){index++;render()}else{$('game').classList.add('hidden');$('complete').classList.remove('hidden');$('result').textContent=`총 ${order.length}문제 중 ${correct}문제를 맞혔어요!`}}$('check').onclick=check;$('next').onclick=next;$('clear').onclick=()=>{if(!solved){placed.fill(null);$('feedback').textContent='';draw()}};$('speak').onclick=speak;$('restart').onclick=start;$('again').onclick=start;$('category').onchange=start;start();</script></body></html>
